[package]
name = "imsg"
description = "Command-line client for imessaged"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
imessage-common.workspace = true
imsg-client.workspace = true
open-absinthe.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
env_logger.workspace = true
log.workspace = true
tokio.workspace = true
futures-util = { version = "0.3", default-features = false }
rpassword = "7"
# Wipes the Apple ID password from memory after use.
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Reads the daemon's config.toml (anisette_url) for `doctor`.
toml = "0.8"
# The Mac's pinned-conversations plist (`sync-mac`).
plist.workspace = true
# `imsg setup` downloads Apple's files (the reqwest / rustls imessaged
# already links).
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

# SIGPIPE reset (main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Integration tests run imessaged in-process with MockEngine on a private
# bus. Dev-only: `cargo tree -p imsg -e normal` stays free of rustpush.
imessaged = { path = "../imessaged" }
tempfile = "3"
# The integration tests open their own bus connection.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
