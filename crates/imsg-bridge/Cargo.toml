[package]
name = "imsg-bridge"
description = "Network bridge for imessaged: HTTP + WebSocket on the Tailscale interface (docs/BRIDGE.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "imsg-bridge"
path = "src/main.rs"

[dependencies]
imessage-common.workspace = true
imsg-client.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
sha2.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-util = "0.3"
# Already in the lock file (rustpush / zbus); same majors.
rand = "0.9"
base64 = "0.22"
toml = "0.8"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
# Same zbus 5 / tokio stack as imsg-client (signal messages are decoded here).
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
# Integration tests run imessaged in-process with MockEngine on a private
# bus (as crates/imsg-tui/tests does).
imessaged = { path = "../imessaged" }
tempfile = "3"
tokio-tungstenite = "0.28"
